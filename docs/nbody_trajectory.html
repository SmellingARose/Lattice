// Parse CSV
const lines = csvText.trim().split('\n');
const headers = lines[0].split(',');
const data = lines.slice(1).map(l => {
  const vals = l.split(',');
  const row = {};
  headers.forEach((h, i) => row[h] = vals[i] === 'nan' ? NaN : parseFloat(vals[i]));
  return row;
});

const N_BH = 3;
const colors = ['#ff6060', '#60ff60', '#6080ff', '#ffff60', '#ff60ff'];
const names = ['BH 0', 'BH 1', 'BH 2', 'BH 3', 'BH 4'];

// Animation state
let playing = false;
let animId = null;
let speed = 1;
const speeds = [1, 2, 4, 8];
let speedIdx = 0;

const slider = document.getElementById('slider');
slider.max = data.length - 1;
const timeDisp = document.getElementById('time-display');
const playBtn = document.getElementById('play-btn');
const speedBtn = document.getElementById('speed-btn');

playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  if (playing) animate();
  else cancelAnimationFrame(animId);
};
speedBtn.onclick = () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  speed = speeds[speedIdx];
  speedBtn.textContent = speed + 'x';
};

let frameCount = 0;
function animate() {
  if (!playing) return;
  frameCount++;
  if (frameCount % Math.max(1, Math.round(4 / speed)) === 0) {
    let v = parseInt(slider.value) + 1;
    if (v >= data.length) { v = 0; }
    slider.value = v;
    render(v);
  }
  animId = requestAnimationFrame(animate);
}

slider.oninput = () => render(parseInt(slider.value));

function worldToCanvas(x, y, cx, cy, scale, w, h) {
  return [w/2 + (x - cx) * scale, h/2 - (y - cy) * scale];
}

function drawTrajectoryPlane(canvasId, xKey, yKey, xLabel, yLabel, step) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Auto-scale to data range
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
  for (const row of data) {
    for (let b = 0; b < N_BH; b++) {
      const x = row['bh' + b + '_' + xKey];
      const y = row['bh' + b + '_' + yKey];
      if (!isNaN(x) && !isNaN(y)) {
        xmin = Math.min(xmin, x); xmax = Math.max(xmax, x);
        ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
      }
    }
  }
  // Add padding
  const pad = 3;
  xmin -= pad; xmax += pad; ymin -= pad; ymax += pad;
  const range = Math.max(xmax - xmin, ymax - ymin);
  const cx = (xmin + xmax) / 2, cy = (ymin + ymax) / 2;
  const scale = (W - 60) / range;

  // Grid lines
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 0.5;
  for (let gx = Math.ceil(xmin); gx <= Math.floor(xmax); gx += 2) {
    const [sx] = worldToCanvas(gx, 0, cx, cy, scale, W, H);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }
  for (let gy = Math.ceil(ymin); gy <= Math.floor(ymax); gy += 2) {
    const [, sy] = worldToCanvas(0, gy, cx, cy, scale, W, H);
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  const [ox, oy] = worldToCanvas(0, 0, cx, cy, scale, W, H);
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();

  // Labels
  ctx.fillStyle = '#555';
  ctx.font = '11px Menlo, monospace';
  ctx.fillText(xLabel, W - 20, oy - 5);
  ctx.fillText(yLabel, ox + 5, 15);

  // Draw trails + current positions for each BH
  for (let b = 0; b < N_BH; b++) {
    const col = colors[b];
    // Trail (all points up to step)
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    for (let s = 0; s <= step; s++) {
      const x = data[s]['bh' + b + '_' + xKey];
      const y = data[s]['bh' + b + '_' + yKey];
      if (isNaN(x) || isNaN(y)) continue;
      const [sx, sy] = worldToCanvas(x, y, cx, cy, scale, W, H);
      if (!started) { ctx.moveTo(sx, sy); started = true; }
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1.0;

    // Current position
    const row = data[step];
    const x = row['bh' + b + '_' + xKey];
    const y = row['bh' + b + '_' + yKey];
    if (isNaN(x) || isNaN(y)) continue;
    const [sx, sy] = worldToCanvas(x, y, cx, cy, scale, W, H);

    // Glow
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 14);
    grad.addColorStop(0, col + '80');
    grad.addColorStop(1, col + '00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI * 2); ctx.fill();

    // Dot
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2); ctx.fill();

    // Label
    ctx.fillStyle = col;
    ctx.font = 'bold 10px Menlo, monospace';
    ctx.fillText(names[b], sx + 8, sy - 8);
  }
}

function drawLapsePlot(step) {
  const canvas = document.getElementById('lapse-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const margin = {l: 50, r: 10, t: 10, b: 30};
  const pw = W - margin.l - margin.r;
  const ph = H - margin.t - margin.b;

  ctx.clearRect(0, 0, W, H);

  const tmax = data[data.length - 1].time;
  const tmin = data[0].time;

  // Find lapse range
  let lmin = 1, lmax = 0;
  for (const row of data) {
    for (let b = 0; b < N_BH; b++) {
      const v = row['bh' + b + '_lapse'];
      if (!isNaN(v)) { lmin = Math.min(lmin, v); lmax = Math.max(lmax, v); }
    }
  }
  lmin = Math.max(0, lmin - 0.02);
  lmax = Math.min(1, lmax + 0.02);

  function tx(t) { return margin.l + (t - tmin) / (tmax - tmin) * pw; }
  function ty(l) { return margin.t + (1 - (l - lmin) / (lmax - lmin)) * ph; }

  // Grid
  ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 0.5;
  for (let g = Math.ceil(lmin * 10) / 10; g <= lmax; g += 0.05) {
    const y = ty(g);
    ctx.beginPath(); ctx.moveTo(margin.l, y); ctx.lineTo(W - margin.r, y); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(margin.l, margin.t); ctx.lineTo(margin.l, H - margin.b);
  ctx.lineTo(W - margin.r, H - margin.b); ctx.stroke();

  // Labels
  ctx.fillStyle = '#666'; ctx.font = '10px Menlo, monospace';
  ctx.fillText('t / M', W/2 - 15, H - 5);
  ctx.save();
  ctx.translate(12, H/2 + 15);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('lapse min', 0, 0);
  ctx.restore();

  // Tick labels
  ctx.fillStyle = '#555'; ctx.font = '9px Menlo, monospace';
  for (let t = 0; t <= tmax; t += 2) {
    ctx.fillText(t.toFixed(0), tx(t) - 5, H - margin.b + 14);
  }
  for (let l = Math.ceil(lmin * 10) / 10; l <= lmax; l += 0.1) {
    ctx.fillText(l.toFixed(1), margin.l - 30, ty(l) + 3);
  }

  // Curves
  for (let b = 0; b < N_BH; b++) {
    ctx.strokeStyle = colors[b];
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    for (let s = 0; s < data.length; s++) {
      const v = data[s]['bh' + b + '_lapse'];
      if (isNaN(v)) continue;
      const x = tx(data[s].time), y = ty(v);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Current time marker
  ctx.strokeStyle = '#ff8'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
  const cx = tx(data[step].time);
  ctx.beginPath(); ctx.moveTo(cx, margin.t); ctx.lineTo(cx, H - margin.b); ctx.stroke();
  ctx.setLineDash([]);
}

function updateInfo(step) {
  const row = data[step];
  let html = '';
  for (let b = 0; b < N_BH; b++) {
    const x = row['bh' + b + '_x'], y = row['bh' + b + '_y'], z = row['bh' + b + '_z'];
    const mass = row['bh' + b + '_mass'], spin = row['bh' + b + '_spin'];
    const lapse = row['bh' + b + '_lapse'];
    const cls = 'bh' + b;
    if (isNaN(x)) {
      html += `<div class="${cls}"><span class="bh-label">${names[b]}:</span> MERGED</div>`;
    } else {
      html += `<div class="${cls}"><span class="bh-label">${names[b]}:</span> ` +
        `pos=(${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)}) ` +
        `lapse=${lapse.toFixed(4)}</div>`;
    }
  }
  document.getElementById('bh-info').innerHTML = html;

  let ghtml = '';
  ghtml += `<div class="stat-row"><span class="stat-label">Ham L2:</span><span class="stat-val">${row.ham_l2.toExponential(3)}</span></div>`;
  ghtml += `<div class="stat-row"><span class="stat-label">Mom L2:</span><span class="stat-val">${row.mom_l2.toExponential(3)}</span></div>`;
  ghtml += `<div class="stat-row"><span class="stat-label">Active BHs:</span><span class="stat-val">${row.n_active}</span></div>`;
  ghtml += `<div class="stat-row"><span class="stat-label">Leaf blocks:</span><span class="stat-val">${row.n_leaves}</span></div>`;
  ghtml += `<div class="stat-row"><span class="stat-label">Mergers:</span><span class="stat-val">${row.n_mergers}</span></div>`;
  document.getElementById('global-info').innerHTML = ghtml;
}

function render(step) {
  timeDisp.textContent = `t = ${data[step].time.toFixed(3)} M`;
  drawTrajectoryPlane('xy-canvas', 'x', 'y', 'x', 'y', step);
  drawTrajectoryPlane('xz-canvas', 'x', 'z', 'x', 'z', step);
  drawLapsePlot(step);
  updateInfo(step);
}

render(0);
</script>
